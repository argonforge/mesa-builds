name: Build Mesa for Devuan stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (must match Devuan package ver)'
        required: true
        default: 'v25.0.7-2+deb13u1'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Single runner, so run after build i386. Do not parallelize
    needs: build-i386
    strategy:
      fail-fast: true
      matrix:
        include:
          - ver: v3
            flags: -march=x86-64-v3 -mtune=znver3 ${{ vars.FLAGS }}
            isa: avx2
          - ver: v4
            flags: -march=x86-64-v4 -mtune=znver4 ${{ vars.FLAGS }}
            isa: avx512
    runs-on: self-hosted
    timeout-minutes: 60
    container:
      image: nafigat0r/devuan:6-dev
      options: --user 0:0
    env:
      OPT_FLAGS: ${{ matrix.flags }}
      CCACHE_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/.ccache-${{ matrix.ver }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CC: ccache clang
      CXX: ccache clang++
    steps:
      - name: Compute version variables
        run: |
          PACKAGE_VERSION="${TAG#v}"
          MESA_VERSION="${PACKAGE_VERSION%-*}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "MESA_VERSION=$MESA_VERSION" >> $GITHUB_ENV

      - name: Fix workspace ownership
        if: always()
        run: chown -R 0:0 "/__w/${{ github.event.repository.name }}" || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          set-safe-directory: false

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mesa-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-mesa-${{ matrix.ver }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Download Mesa source
        run: |
          rm -rf mesa-${MESA_VERSION}
          rm -f mesa_${PACKAGE_VERSION}.dsc mesa_${MESA_VERSION}.orig.tar.xz mesa_${PACKAGE_VERSION}.debian.tar.xz

          apt update
          apt source mesa-vulkan-drivers=${PACKAGE_VERSION}

      - name: Install build dependencies from control file
        run: |
          cd mesa-${MESA_VERSION}
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            debian/control

      - name: Patch debian/rules with optimization flags
        run: |
          cd mesa-${MESA_VERSION}
          patch -p1 --fuzz=0 < ../.github/helpers/patches/flags.patch
          grep -B 1 '^override_dh_auto_configure:' debian/rules

      - name: Bump package version with ISA suffix
        working-directory: mesa-${{ env.MESA_VERSION }}
        env:
          DEBEMAIL: postmaster@itvault.info
          DEBFULLNAME: Argon Forge Mesa workflow
        run: |
          if [ ! -f debian/changelog ]; then
            echo "ERROR: debian/changelog not found in $(pwd)"
            exit 1
          fi

          CURRENT_VER=$(dpkg-parsechangelog -S Version)
          if [ -z "$CURRENT_VER" ]; then
            echo "ERROR: could not parse current version from debian/changelog"
            exit 1
          fi

          export SOURCE_DATE_EPOCH=$(dpkg-parsechangelog -S Timestamp)

          NEW_VER="${CURRENT_VER}+${{ matrix.isa }}"
          echo "Original version: ${CURRENT_VER}"
          echo "New version: ${NEW_VER}"
          dch --newversion "$NEW_VER" "Rebuild with ${{ matrix.isa }} optimizations"

      - name: Build .deb packages
        run: |
          mkdir -p packages
          mkdir -p dev-packages
          cd mesa-${MESA_VERSION}
          dh_clean
          rm -rf build obj-*
          # noautodbgsym - don't make dbgsym-packages
          # noddebs - don't make .ddeb
          export DEB_BUILD_OPTIONS="noautodbgsym noddebs"
          dpkg-buildpackage -b -us -uc
          # copy packages
          find .. -maxdepth 1 \
            -name '*.deb' \
            ! -name '*dbgsym*' \
            ! -name '*ddeb*' \
            ! -name '*-dev_*' \
            -exec mv {} ../packages/ \;
          # copy dev-packages
          find .. -maxdepth 1 \
            -name '*-dev_*.deb' \
            ! -name '*dbgsym*' \
            ! -name '*ddeb*' \
            -exec mv {} ../dev-packages/ \;

      - name: Verify no dbgsym packages
        run: |
          if [ -z "$(ls -A packages/ 2>/dev/null)" ]; then
            echo "ERROR: packages/ is empty - dpkg-buildpackage produced no .deb"
            exit 1
          fi

          if ls packages/*dbgsym* packages/*ddeb* dev-packages/*dbgsym* dev-packages/*ddeb* 2>/dev/null; then
            echo "ERROR: dbgsym/ddeb packages found!"
            exit 1
          fi
          echo "OK: no dbgsym packages"
          ls -lh packages/
          ls -lh dev-packages/

      - name: Make archives
        run: |
          tar -caf "mesa-${TAG}-x86-64-${{ matrix.ver }}.tar.zst" "packages"
          tar -caf "mesa-${TAG}-dev-x86-64-${{ matrix.ver }}.tar.zst" "dev-packages"

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesa-deb-packages-amd64-${{ matrix.ver }}
          path: ./*.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

  build-i386:
    strategy:
      fail-fast: true
      matrix:
        include:
          - ver: v3
            flags: -march=i686 -mtune=znver3 -mavx2 -mfma -mbmi -mbmi2 -mf16c -mmovbe ${{ vars.FLAGS }}
            isa: avx2
          - ver: v4
            flags: -march=i686 -mtune=znver4 -mavx2 -mfma -mbmi -mbmi2 -mf16c -mmovbe -mavx512f -mavx512bw -mavx512cd -mavx512dq -mavx512vl ${{ vars.FLAGS }}
            isa: avx512
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      IMAGE: nafigat0r/devuan:6-dev-i386
      WORKDIR: /work
      OPT_FLAGS: ${{ matrix.flags }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-i386-${{ matrix.ver }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Compute version variables
        run: |
          PACKAGE_VERSION="${TAG#v}"
          MESA_VERSION="${PACKAGE_VERSION%-*}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "MESA_VERSION=$MESA_VERSION" >> $GITHUB_ENV

      - name: Fix workspace ownership
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            --user 0:0 \
            "$IMAGE" chown -R $(id -u):$(id -g) /work

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          set-safe-directory: false

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mesa-i386-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-mesa-i386-${{ matrix.ver }}-

      - name: Download Mesa source
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e HOME=/tmp \
            -w "${{ env.WORKDIR }}" \
            "$IMAGE" bash -c '
              rm -rf mesa-${MESA_VERSION}
              rm -f mesa_${PACKAGE_VERSION}.dsc mesa_${MESA_VERSION}.orig.tar.xz mesa_${PACKAGE_VERSION}.debian.tar.xz
              apt update
              apt source mesa-vulkan-drivers=${PACKAGE_VERSION}
            '

      - name: Patch debian/rules for i386 build
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -w "${{ env.WORKDIR }}/mesa-${MESA_VERSION}" \
            "$IMAGE" bash -c '
              patch -p1 --fuzz=0 < ../.github/helpers/patches/flags.patch
              grep -n "OPT_FLAGS\|gallium-rusticl\|gallium-opencl" debian/rules
            '

      - name: Bump package version with ISA suffix
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -e DEBEMAIL=postmaster@itvault.info -e DEBFULLNAME="Argon Forge Mesa workflow" \
            -e SOURCE_DATE_EPOCH="$(dpkg-parsechangelog -S Timestamp)" \
            -w "${{ env.WORKDIR }}/mesa-${MESA_VERSION}" \
            "$IMAGE" bash -c '
              if [ ! -f debian/changelog ]; then
                echo "ERROR: debian/changelog not found"; exit 1;
              fi

              CURRENT_VER=$(dpkg-parsechangelog -S Version)
              if [ -z "$CURRENT_VER" ]; then
                echo "ERROR: could not parse version"; exit 1;
              fi

              export SOURCE_DATE_EPOCH=$(dpkg-parsechangelog -S Timestamp)

              NEW_VER="${CURRENT_VER}+${{ matrix.isa }}"
              echo "Original version: ${CURRENT_VER}"
              echo "New version: ${NEW_VER}"
              dch --newversion "$NEW_VER" "Rebuild with ${{ matrix.isa }} optimizations for i386"
            '

      - name: Build i386 .deb packages
        run: |
          mkdir -p packages dev-packages
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e CCACHE_DIR="${{ env.WORKDIR }}/.ccache-i386-${{ matrix.ver }}" \
            -e CCACHE_MAXSIZE -e CCACHE_COMPRESS \
            -e OPT_FLAGS \
            -e CC="ccache clang" \
            -e CXX="ccache clang++" \
            -e DEB_BUILD_OPTIONS="noautodbgsym noddebs" \
            -e HOME=/tmp \
            -w "${{ env.WORKDIR }}/mesa-${MESA_VERSION}" \
            "$IMAGE" bash -c '
              dh_clean
              rm -rf build obj-*
              dpkg-buildpackage -b -us -uc
              find .. -maxdepth 1 \
                -name '*_i386.deb' \
                ! -name '*dbgsym*' \
                ! -name '*ddeb*' \
                ! -name '*-dev_*' \
                -exec mv {} ../packages/ \;
              find .. -maxdepth 1 \
                -name '*-dev_*_i386.deb' \
                ! -name '*dbgsym*' \
                ! -name '*ddeb*' \
                -exec mv {} ../dev-packages/ \;
            '

      - name: Verify no dbgsym packages
        run: |
          if [ -z "$(ls -A packages/ 2>/dev/null)" ]; then
            echo "ERROR: packages/ is empty - dpkg-buildpackage produced no .deb"
            ls -lh ../*.deb 2>/dev/null || echo "no .deb files in parent"
            exit 1
          fi
          if ls packages/*dbgsym* packages/*ddeb* dev-packages/*dbgsym* dev-packages/*ddeb* 2>/dev/null; then
            echo "ERROR: dbgsym/ddeb packages found!"
            exit 1
          fi
          echo "OK: no dbgsym packages"
          ls -lh packages/
          ls -lh dev-packages/

      - name: Make archives
        run: |
          tar -caf "mesa-${TAG}-i386-${{ matrix.ver }}.tar.zst" "packages"
          tar -caf "mesa-${TAG}-dev-i386-${{ matrix.ver }}.tar.zst" "dev-packages"

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesa-deb-packages-i386-${{ matrix.ver }}
          path: ./*.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e CCACHE_DIR="${{ env.WORKDIR }}/.ccache-i386-${{ matrix.ver }}" \
            -e CCACHE_MAXSIZE \
            -e CCACHE_COMPRESS \
            -e HOME=/tmp \
            "$IMAGE" ccache -s || true

  publish:
    needs: [build, build-i386]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reprepro and gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Unpack deb files
        run: |
          mkdir -p build
          for f in artifacts/*.tar.zst; do
            echo "Extracting $f"
            tar --zstd -xf "$f" -C build --strip-components=1
          done
          echo "--- .deb files in build/ ---"
          find build -name '*.deb' -type f | sort

      - name: Import GPG key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --no-tty --import
          echo "--- Imported secret keys ---"
          gpg --list-secret-keys
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create APT repository
        run: |
          mkdir -p apt-repo/conf
          cp .github/helpers/distributions apt-repo/conf/distributions

          for arch in amd64 i386; do
            for codename in stable-avx2 stable-avx512; do
              for deb in build/*+${codename#stable-}_${arch}.deb; do
                [ -f "$deb" ] || continue
                reprepro -Vb apt-repo -C main -A ${arch} includedeb ${codename} "$deb"
              done
            done
          done

          echo "--- Repository structure ---"
          find apt-repo -type f | sort

          echo "--- Export public key ---"
          gpg --armor --export > apt-repo/public.asc
          ls -lh apt-repo/public.asc

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.draft }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.draft }}
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.draft }}

  release:
    needs: [build, build-i386]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION="${TAG#v}"
          MESA_VERSION="${MESA_VERSION%-*}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="${MESA_VERSION} (Clang)"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.zst
          fi
