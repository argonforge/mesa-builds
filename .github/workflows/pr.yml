# This workflow will check a PR for mesa-builds project

name: PR

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  pull_request:

jobs:
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spell Check Repo
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  commit-me:
    name: Conventional Commits Compliance
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      # Enable colored output in GitHub Actions
      FORCE_COLOR: 3
    steps:
      - uses: dev-build-deploy/commit-me@d514fec15ea83c0643013c801a375893eb51a433 # v2.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Required to retrieve the commits associated with your Pull Request
          include-commits: true  # OPTIONAL; forces the inclusion of commits associated with your Pull Request
