name: Build Mesa for Devuan stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (must match Devuan package ver)'
        required: true
        default: 'v25.0.7-2+deb13u1'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - ver: v3
            flags: -march=x86-64-v3 -mtune=znver3 ${{ vars.FLAGS }}
          - ver: v4
            flags: -march=x86-64-v4 -mtune=znver4 ${{ vars.FLAGS }}
    runs-on: self-hosted
    timeout-minutes: 30
    container:
      image: nafigat0r/devuan:6-dev
    env:
      OPT_FLAGS: ${{ matrix.flags }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-${{ matrix.ver }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Compute version variables
        run: |
          PACKAGE_VERSION="${TAG#v}"
          MESA_VERSION="${PACKAGE_VERSION%-*}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "MESA_VERSION=$MESA_VERSION" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mesa-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-mesa-${{ matrix.ver }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Download Mesa source
        run: |
          apt update
          apt source mesa-vulkan-drivers=${PACKAGE_VERSION}

      - name: Install build dependencies from control file
        run: |
          cd mesa-${MESA_VERSION}
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            debian/control

      - name: Patch debian/rules with optimization flags
        run: |
          # Prepend ccache wrappers to PATH
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          cd mesa-${MESA_VERSION}
          sed -i '/^override_dh_auto_configure:/i confflags += -Dc_args="${{ env.OPT_FLAGS }}" -Dcpp_args="${{ env.OPT_FLAGS }}"' debian/rules
          grep -B 1 '^override_dh_auto_configure:' debian/rules

      - name: Build .deb packages
        run: |
          mkdir -p packages
          mkdir -p dev-packages
          cd mesa-${MESA_VERSION}
          dh_clean
          rm -rf build obj-*
          # noautodbgsym - don't make dbgsym-packages
          # noddebs - don't make .ddeb
          export DEB_BUILD_OPTIONS="noautodbgsym noddebs"
          dpkg-buildpackage -b -us -uc
          # copy packages
          find .. -maxdepth 1 \
            -name '*.deb' \
            ! -name '*dbgsym*' \
            ! -name '*ddeb*' \
            ! -name '*-dev_*' \
            -exec mv {} ../packages/ \;
          # copy dev-packages
          find .. -maxdepth 1 \
            -name '*-dev_*.deb' \
            ! -name '*dbgsym*' \
            ! -name '*ddeb*' \
            -exec mv {} ../dev-packages/ \;

      - name: Verify no dbgsym packages
        run: |
          if [ -z "$(ls -A packages/ 2>/dev/null)" ]; then
            echo "ERROR: packages/ is empty - dpkg-buildpackage produced no .deb"
            exit 1
          fi

          if ls packages/*dbgsym* packages/*ddeb* dev-packages/*dbgsym* dev-packages/*ddeb* 2>/dev/null; then
            echo "ERROR: dbgsym/ddeb packages found!"
            exit 1
          fi
          echo "OK: no dbgsym packages"
          ls -lh packages/
          ls -lh dev-packages/

      - name: Make archives
        run: |
          tar -caf "mesa-${TAG}-x86-64-${{ matrix.ver }}.tar.zst" "packages"
          tar -caf "mesa-${TAG}-dev-x86-64-${{ matrix.ver }}.tar.zst" "dev-packages"

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesa-deb-packages-${{ matrix.ver }}
          path: ./*.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION="${TAG#v}"
          MESA_VERSION="${MESA_VERSION%-*}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="Mesa ${MESA_VERSION} (${TAG})"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.zst
          fi
